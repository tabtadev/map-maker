<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map DmTool — TTRPG Battle Map Suite</title>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #ddd;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 32px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    header p {
      font-size: 14px;
      color: #888;
      max-width: 440px;
    }

    .cards {
      display: flex;
      gap: 16px;
      max-width: 820px;
      width: 100%;
    }

    .card {
      flex: 1;
      text-decoration: none;
      color: #ccc;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .card:hover {
      border-color: #444;
      background: #1f1f1f;
    }

    .card .icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
    .card h2 {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }
    .card p {
      font-size: 13px;
      color: #777;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .card .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .card .tags span {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #252525;
      color: #999;
    }

    .card .btn {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 18px;
      margin-top: auto;
      transition: background 0.2s;
    }
    .card:hover .btn {
      background: #444;
    }

    .card.featured {
      border-color: #333;
      flex: 1.3;
    }
    .card.featured .btn {
      background: #2d6a3f;
      border-color: #3a8a52;
    }
    .card.featured:hover .btn {
      background: #3a8a52;
    }

    footer {
      margin-top: 40px;
      font-size: 11px;
      color: #444;
    }

    @media (max-width: 700px) {
      .cards { flex-direction: column; max-width: 360px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Map DmTool</h1>
    <p>Battle maps, fog of war, tokens, initiative, dice and effects — in your browser.</p>
  </header>

  <main class="cards">
    <a class="card featured" href="map-dmtool.html">
      <div class="icon">⚡</div>
      <h2>Launch Map DmTool</h2>
      <p>All-in-one editor with fog of war, tokens, initiative, dice, lighting, and player view.</p>
      <div class="tags">
        <span>Fog of War</span>
        <span>Tokens</span>
        <span>Initiative</span>
        <span>Dice</span>
        <span>Lighting</span>
        <span>Player View</span>
      </div>
      <span class="btn">Launch</span>
    </a>
  </main>

  <footer>Map DmTool — Free &amp; open-source</footer>

</body>
</html>
